<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-time Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" class="login">
    <form id="login-form" class="card">
      <h1>Real-time Chat</h1>
      <p class="muted">Suhbatga qo'shilish uchun ismingizni kiriting</p>
      <input id="name-input" maxlength="24" placeholder="Ismingiz" autocomplete="off" required autofocus>
      <button type="submit">Kirish</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <main id="chat" class="chat" hidden>
    <aside class="sidebar">
      <header class="sidebar-head">
        <strong>Xonalar</strong>
        <span id="status" class="status" title="Ulanish holati"></span>
      </header>
      <ul id="room-list" class="list"></ul>
      <form id="room-form" class="room-form">
        <input id="room-input" maxlength="24" placeholder="Yangi xona" autocomplete="off">
        <button type="submit" aria-label="Xona yaratish">+</button>
      </form>
      <strong class="sidebar-title">Onlayn (<span id="user-count">0</span>)</strong>
      <ul id="user-list" class="list users"></ul>
    </aside>

    <section class="conversation">
      <header class="conv-head">
        <h2 id="room-title">#umumiy</h2>
        <span id="me" class="muted"></span>
      </header>
      <ol id="messages" class="messages" aria-live="polite"></ol>
      <div id="typing" class="typing muted"></div>
      <form id="message-form" class="composer">
        <input id="message-input" maxlength="1000" placeholder="Xabar yozing..." autocomplete="off">
        <button type="submit">Yuborish</button>
      </form>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
